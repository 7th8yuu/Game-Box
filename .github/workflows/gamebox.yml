name: Build Game Box
on:
  push:
    paths: ['gamebox/**', '.github/workflows/gamebox.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p gamebox assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-debug
          path: gamebox/app/build/outputs/apk/debug/*.apk
  # Mở app trên emulator (không root) và in logcat nếu crash. Không làm đỏ cả lần chạy.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with: { name: GameBox-debug, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apk/app-debug.apk
            adb shell appops set com.gamebox.helper SYSTEM_ALERT_WINDOW allow
            adb logcat -c
            adb shell am start -S -W -n com.gamebox.helper/.HubActivity
            sleep 12
            adb shell am start -S -W -n com.gamebox.helper/.MainActivity
            sleep 12
            adb shell appops set com.gamebox.helper SYSTEM_ALERT_WINDOW deny
            adb shell am start -S -W -n com.gamebox.helper/.MainActivity --ez smoke_overlay true
            sleep 6
            adb shell appops set com.gamebox.helper SYSTEM_ALERT_WINDOW allow
            adb shell am start -S -W -n com.gamebox.helper/.MainActivity --ez smoke_overlay true
            sleep 10
            adb shell dumpsys activity services com.gamebox.helper | grep -c "ServiceRecord" || echo "no running service"
            adb logcat -d -t 5000 > smoke.log
            adb shell pidof com.gamebox.helper || echo "APP NOT RUNNING"
            grep -E -A45 "FATAL EXCEPTION" smoke.log || echo "NO FATAL EXCEPTION"
            adb shell run-as com.gamebox.helper cat files/crash.txt || echo "NO crash.txt"
